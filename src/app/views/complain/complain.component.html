<div class="page-header">
    <h3 class="page-title">
        Complaints
    </h3>
</div>

<ng-container *ngIf="gettingData; else elseFoundDataTemplate">
    <loading-spinner></loading-spinner>
</ng-container>
<ng-template #elseFoundDataTemplate>
    <empty-list *ngIf="complains.length <= 0"></empty-list>
    <div class="col-lg-12 grid-margin stretch-card" *ngIf="complains.length > 0">
        <div class="card">
            <div class="card-body">
                <h4 class="card-title">Complaints List</h4>
                <div class="table-responsive">
                    <table class="table table-striped">
                        <thead>
                            <tr>
                                <th>
                                    Full name
                                </th>
                                <th>
                                    Mobile number
                                </th>
                                <th>
                                    Complain
                                </th>
                                <th>
                                    Status
                                </th>
                                <th>
                                    Date
                                </th>
                                <th>
                                    Actions
                                </th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr *ngFor="let item of complains">
                                <td>
                                    {{ item.passenger.fullName }}
                                </td>
                                <td>
                                    {{ item.passenger.phone }}
                                </td>
                                <td>
                                    {{ item.complain }}
                                </td>
                                <td>
                                    <ng-container *ngIf="item.isResolved; else elseNotResolvedTemplate">
                                        <label class="badge badge-success">Resolved</label>
                                    </ng-container>
                                    <ng-template #elseNotResolvedTemplate>
                                        <label class="badge badge-danger">Open</label>
                                    </ng-template>
                                </td>
                                <td>
                                    {{ item.createdAt | date:'MMM d, y, h:mm a' }}
                                </td>
                                <td>
                                    <button type="button" class="btn btn-warning btn-sm"
                                        (click)="openResolveItem(resolveModal, item)">Resolve</button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    <ngb-pagination class="d-flex justify-content-center pagination-warning" (pageChange)="pageChange($event)"
        [collectionSize]="totalCount" [maxSize]="5" [pageSize]="pageSize" [page]="pageIndex"
        aria-label="Default pagination"></ngb-pagination>

</ng-template>

<ng-template #resolveModal let-modal class="modal fade" id="exampleModal-2" aria-labelledby="exampleModalLabel-2">
    <div class="modal-content">
        <div class="modal-header">
            <h5 class="modal-title" id="exampleModalLabel-2">Resolve Complaint</h5>
            <button type="button" class="close" (click)="modal.dismiss()" aria-label="Close">
                <span aria-hidden="true">&times;</span>
            </button>
        </div>
        <div class="modal-body m-3">
            Confirm resolving romplaint.
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-warning" (click)="resolveItem()">Resolve</button>
            <button type="button" class="btn btn-light" (click)="modal.close()">Close</button>
        </div>
    </div>
</ng-template>
