<div class="page-header">
    <h3 class="page-title">
        Students Requests
    </h3>
</div>

<ng-container *ngIf="gettingData; else elseFoundDataTemplate">
    <loading-spinner></loading-spinner>
</ng-container>
<ng-template #elseFoundDataTemplate>
    <empty-list *ngIf="passengers.length <= 0"></empty-list>
    <div class="col-lg-12 grid-margin stretch-card" *ngIf="passengers.length > 0">
        <div class="card">
            <div class="card-body">
                <h4 class="card-title">Students Requests List</h4>
                <div class="table-responsive">
                    <table class="table table-striped">
                        <thead>
                            <tr>
                                <th>
                                    Name
                                </th>
                                <th>
                                    Email
                                </th>
                                <th>
                                    Phone
                                </th>
                                <th>
                                    Age
                                </th>
                                <th *ngIf="!sharedUserData.isAnalystAdmin">
                                    Certificate
                                </th>
                                <th *ngIf="!sharedUserData.isAnalystAdmin">
                                    Actions
                                </th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr *ngFor="let item of passengers">
                                <td>
                                    {{ item.fullName }}
                                </td>
                                <td>
                                    {{ item.email }}
                                </td>
                                <td>
                                    {{ item.phone }}
                                </td>
                                <td>
                                    {{ item.age }}
                                </td>
                                <td *ngIf="!sharedUserData.isAnalystAdmin">
                                    <button type="button" class="btn btn-info btn-sm"
                                        (click)="downloadCertificate(item)">Certificate</button>
                                </td>
                                <td *ngIf="!sharedUserData.isAnalystAdmin">
                                    <button type="button" class="btn btn-warning btn-sm"
                                        (click)="openApproveModal(approveModal, item, true)">Approve</button>
                                    <button type="button" class="btn btn-danger btn-sm"
                                        (click)="openApproveModal(approveModal, item, false)">Reject</button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    <ngb-pagination class="d-flex justify-content-center pagination-warning" (pageChange)="pageChange($event)"
        [collectionSize]="totalCount" [maxSize]="5" [pageSize]="pageSize" [page]="pageIndex"
        aria-label="Default pagination"></ngb-pagination>

</ng-template>

<ng-template #approveModal let-modal class="modal fade" id="exampleModal-2" aria-labelledby="exampleModalLabel-2">
    <div class="modal-content">
        <div class="modal-header">
            <h5 class="modal-title" id="exampleModalLabel-2">Approve/Reject request</h5>
            <button type="button" class="close" (click)="modal.dismiss()" aria-label="Close">
                <span aria-hidden="true">&times;</span>
            </button>
        </div>
        <div class="modal-body m-3">
            <ng-container *ngIf="approveRequest; else elseRejectTemplate">
                <span class="text-success font-weight-bold">Approve</span> student request.
            </ng-container>
            <ng-template #elseRejectTemplate>
                <span class="text-danger font-weight-bold">Reject</span> student request.
            </ng-template>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-primary" (click)="submit()">Submit</button>
            <button type="button" class="btn btn-light" (click)="modal.close()">Close</button>
        </div>
    </div>
</ng-template>
