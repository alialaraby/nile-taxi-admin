<div class="page-header">
    <h3 class="page-title">
        Passengers
    </h3>
    <!-- <nav aria-label="breadcrumb">
        <button type="button" class="btn btn-warning btn-fw">Add</button>
    </nav> -->
</div>

<ng-container *ngIf="gettingData; else elseFoundDataTemplate">
    <loading-spinner></loading-spinner>
</ng-container>
<ng-template #elseFoundDataTemplate>
    <div class="col-lg-12 grid-margin stretch-card">
        <div class="card">
            <div class="card-body">
                <!-- <h4 class="card-title">Passengers List</h4> -->

                <!-- Filters -->
                <div class="row w-75">
                    <div class="form-group col-md-4">
                        <label for="code">Select Type</label>
                        <select class="form-control" #type (change)="filterTypes($event.target.value)">
                            <option value="" [selected]="defaultType">User Type</option>
                            <option *ngFor="let type of userTypes" [value]="type">{{ type }}</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <button type="button" class="btn btn-warning btn-rounded btn-icon mt-3"
                            (click)="resetFilters()">
                            <i class="mdi mdi-reload"></i>
                        </button>
                    </div>
                </div>

                <empty-list *ngIf="passengers.length <= 0"></empty-list>

                <div class="table-responsive" *ngIf="passengers.length > 0">
                    <table class="table table-striped">
                        <thead>
                            <tr>
                                <th>
                                    User
                                </th>
                                <th>
                                    Name
                                </th>
                                <th>
                                    Email
                                </th>
                                <th>
                                    Phone
                                </th>
                                <th>
                                    Type
                                </th>
                                <th>
                                    Last Trip Date
                                </th>
                                <th>
                                    Creation Date
                                </th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr *ngFor="let item of passengers">
                                <td class="py-1">
                                    <ng-container
                                        *ngIf="(item.passengerImage && item.passengerImage.length > 0); else elseNoImageTemplate">
                                        <img [src]="item.passengerImage" alt="user image" class="item_image"
                                            onError="this.src='./assets/images/faces/face1.jpg'">
                                    </ng-container>
                                    <ng-template #elseNoImageTemplate>
                                        <img src="./assets/images/faces/face1.jpg" alt="user photo">
                                    </ng-template>
                                </td>
                                <td>
                                    {{ item.fullName }}
                                </td>
                                <td>
                                    {{ item.email }}
                                </td>
                                <td>
                                    {{ item.phone }}
                                </td>
                                <td class="text-capitalize">
                                    {{ item.type }}
                                </td>
                                <td>
                                    {{ item.lastTripDate | date:'mediumDate' }}
                                </td>
                                <td>
                                    {{ item.createdAt | date:'mediumDate' }}
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    <ngb-pagination class="d-flex justify-content-center pagination-warning" (pageChange)="pageChange($event)" [collectionSize]="totalCount" [maxSize]="5" [pageSize]="pageSize" [page]="pageIndex" aria-label="Default pagination"></ngb-pagination>

</ng-template>
