<div class="page-header">
    <h3 class="page-title">
        Stations
    </h3>
    <nav aria-label="breadcrumb">
        <button type="button" class="btn btn-warning btn-fw">Add</button>
    </nav>
</div>

<ng-container *ngIf="gettingData; else elseFoundDataTemplate">
    <loading-spinner></loading-spinner>
</ng-container>
<ng-template #elseFoundDataTemplate>
    <empty-list *ngIf="stations.length <= 0"></empty-list>
    <div class="col-lg-12 grid-margin stretch-card" *ngIf="stations.length > 0">
        <div class="card">
            <div class="card-body">
                <h4 class="card-title">Stations List</h4>
                <!-- <p class="card-description">
                    Add class <code>.table-striped</code>
                </p> -->
                <div class="table-responsive">
                    <table class="table table-striped">
                        <thead>
                            <tr>
                                <th>
                                    Station
                                </th>
                                <th>
                                    Location
                                </th>
                                <th>
                                    Creation Date
                                </th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr *ngFor="let item of stations">
                                <td>
                                    {{ item.name }}
                                </td>
                                <td>
                                    {{ item.location.coordinates }}
                                </td>
                                <td>
                                    {{ item.createdAt | date:'mediumDate' }}
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</ng-template>
