<div class="d-flex align-items-center auth px-0">
    <div class="row w-100 mx-0">
        <div class="col-lg-4 mx-auto">
            <div class="auth-form-light text-left py-5 px-4 px-sm-5">

                <div class="brand-logo text-center">
                    <img src="assets/images/login-logo.png" alt="logo">
                </div>

                <h4 class="text-center">Register as student to Nile Taxi.</h4>

                <form [formGroup]="addEditForm" class="pt-3" (ngSubmit)="submit()">
                    <div class="form-group">
                        <input type="text" class="form-control form-control-lg" id="fullName" formControlName="fullName"
                            placeholder="Full name">
                    </div>
                    <div class="form-group">
                        <input type="email" class="form-control form-control-lg" id="email" formControlName="email"
                            placeholder="Email">
                    </div>
                    <div class="form-group">
                        <input type="tel" class="form-control form-control-lg" id="phone" formControlName="phone"
                            placeholder="Phone">
                    </div>
                    <div class="form-group">
                        <div class="form-check">
                            <label class="form-check-label">
                                <input type="radio" class="form-check-input" formControlName="gender"
                                    id="optionsRadios1" value="male" checked>
                                Male
                                <i class="input-helper"></i>
                            </label>
                        </div>
                        <div class="form-check">
                            <label class="form-check-label">
                                <input type="radio" class="form-check-input" formControlName="gender"
                                    id="optionsRadios2" value="female">
                                Female
                                <i class="input-helper"></i>
                            </label>
                        </div>
                    </div>

                    <div class="form-group">
                        <input type="number" class="form-control form-control-lg" id="age" formControlName="age"
                            placeholder="Age">
                    </div>

                    <div class="form-group">
                        <div class="input-group">
                            <div class="custom-file">
                                <input type="file" class="custom-file-input" formControlName="studentCetificate"
                                    (change)="OnChangeFile($event.target.files)" id="studentCetificate" 
                                    aria-describedby="studentCetificate" placeholder="Enter Certificate" multiple>
                                <label class="custom-file-label" for="studentCetificate">{{shortImageName}}</label>
                            </div>
                        </div>
                    </div>

                    <div class="mt-3">
                        <button type="submit" class="btn btn-warning btn-fw w-100" [disabled]="addEditForm.invalid || submitting">
                            Register
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
